<!DOCTYPE html>

<html>
<head>
<meta charset="UTF-8">
<title>Happy Birthday 🎂</title>

<style>

body{
margin:0;
font-family:Segoe UI;
background:black;
color:white;
text-align:center;
overflow-y:auto;
padding:40px;
}

.stars{
position:fixed;
width:100%;
height:100%;
background:url("https://i.imgur.com/YKY28eT.png");
animation:moveStars 80s linear infinite;
z-index:-1;
}

@keyframes moveStars{
from{background-position:0 0;}
to{background-position:10000px 5000px;}
}

/* shooting stars */

.shooting-star{
position:fixed;
width:2px;
height:80px;
background:white;
opacity:0.8;
transform:rotate(45deg);
animation:shoot 6s linear infinite;
}

@keyframes shoot{
0%{transform:translate(-200px,-200px) rotate(45deg);opacity:0;}
20%{opacity:1;}
100%{transform:translate(1200px,1200px) rotate(45deg);opacity:0;}
}

/* gift */

.gift{
font-size:90px;
cursor:pointer;
margin-top:50px;
animation:bounce 1.5s infinite;
}

@keyframes bounce{
0%,100%{transform:translateY(0);}
50%{transform:translateY(-10px);}
}

/* spark explosion */

.spark{
position:fixed;
width:6px;
height:6px;
background:white;
border-radius:50%;
animation:spark 1s ease-out forwards;
}

@keyframes spark{
to{
transform:scale(15);
opacity:0;
}
}

/* cake */

.cake{
font-size:90px;
margin-top:40px;
display:none;
}

/* candle */

.candle{
cursor:pointer;
font-size:50px;
display:none;
animation:glow 1.2s infinite alternate;
}

@keyframes glow{
from{text-shadow:0 0 10px orange;}
to{text-shadow:0 0 25px yellow;}
}

.hint{
font-size:14px;
opacity:0.6;
}

/* message card */

.letter{
margin:40px auto;
max-width:600px;
font-size:22px;
line-height:1.6;
opacity:0;
background:rgba(255,255,255,0.08);
backdrop-filter:blur(10px);
padding:30px;
border-radius:18px;
}

/* slideshow */

.slideshow{
width:360px;
height:230px;
margin:auto;
border-radius:15px;
overflow:hidden;
display:none;
}

.slideshow img{
width:100%;
height:100%;
object-fit:cover;
}

/* confetti */

.confetti{
position:fixed;
width:8px;
height:8px;
top:-10px;
animation:fall 3s linear forwards;
}

@keyframes fall{
to{transform:translateY(100vh) rotate(720deg);}
}

/* fireworks */

.firework{
position:fixed;
width:6px;
height:6px;
background:white;
border-radius:50%;
animation:explode 1s ease-out forwards;
}

@keyframes explode{
to{
transform:scale(30);
opacity:0;
}
}

</style>

</head>

<body>

<div class="stars"></div>

<div class="shooting-star" style="top:10%;left:20%"></div>
<div class="shooting-star" style="top:30%;left:60%;animation-delay:3s"></div>

<h1>Tonight is a special night ✨</h1>
<p>Because someone amazing was born today</p>

<div class="gift" id="gift">🎁</div>
<div id="giftText">Click the gift to open it</div>

<div class="cake" id="cake">🎂</div>
<div class="candle" id="candle">🕯️</div>
<div class="hint" id="hint">Blow the candle</div>

<div class="letter" id="letter"></div>

<div class="slideshow" id="slideshow">
<img id="slide" src="https://images.unsplash.com/photo-1524504388940-b1c1722653e1">
</div>

<audio id="music">
<source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3">
</audio>

<script>

const gift=document.getElementById("gift");
const cake=document.getElementById("cake");
const candle=document.getElementById("candle");
const hint=document.getElementById("hint");
const letter=document.getElementById("letter");
const music=document.getElementById("music");

/* typewriter */

const text="Happy Birthday to the most amazing sister in the world. May your life always be full of happiness, love and beautiful memories ✨";

let i=0;

function typeWriter(){
if(i<text.length){
letter.innerHTML+=text.charAt(i);
i++;
setTimeout(typeWriter,35);
}
}

/* confetti */

function confetti(){
for(let i=0;i<120;i++){
let c=document.createElement("div");
c.className="confetti";
c.style.left=Math.random()*100+"vw";
c.style.background=`hsl(${Math.random()*360},100%,50%)`;
document.body.appendChild(c);
setTimeout(()=>c.remove(),3000);
}
}

/* fireworks */

function fireworks(){
for(let i=0;i<40;i++){
let fire=document.createElement("div");
fire.className="firework";
fire.style.left=Math.random()*100+"vw";
fire.style.top=Math.random()*60+"vh";
document.body.appendChild(fire);
setTimeout(()=>fire.remove(),1200);
}
}

/* fireworks finale */

function fireworksFinale(){

setInterval(()=>{

for(let i=0;i<20;i++){

let fire=document.createElement("div");
fire.className="firework";
fire.style.left=Math.random()*100+"vw";
fire.style.top=Math.random()*60+"vh";
document.body.appendChild(fire);

setTimeout(()=>fire.remove(),1200);

}

},2000)

}

/* spark explosion */

function sparkExplosion(x,y){

for(let i=0;i<40;i++){

let s=document.createElement("div");
s.className="spark";
s.style.left=x+"px";
s.style.top=y+"px";

document.body.appendChild(s);

setTimeout(()=>s.remove(),1000);

}

}

/* slideshow */

const slides=[
"C:\Users\Abcom\Downloads\BirthdaySurprise\Photo1.jpeg",
"https://drive.google.com/file/d/1iA11qxADDy54IlcPZKhWjgco1k6PhsEV/view?usp=drive_link",
"https://drive.google.com/file/d/1lh_A7-ORpZSGMR7pJWDFZt8Ze2NnWHRa/view?usp=drive_link",
"https://drive.google.com/file/d/191fhLvpjZF9d1ge7DPEGG98-THvw2jdn/view?usp=drive_link",
"https://drive.google.com/file/d/1NnENFYyOJFZTXLuDGro3_QUcqe--Z1IO/view?usp=drive_link",
"https://drive.google.com/file/d/1F3K53dfXjKSm9PFrJ7k10ALtN96UpovK/view?usp=drive_link",
"https://drive.google.com/file/d/17ZQPGkQUyYKgFQdSP_Q_MgTPGhnYW_6Y/view?usp=drive_link",
"https://drive.google.com/file/d/10QyvFYm_bdolWi1Xa0BmySzZqKt755rP/view?usp=drive_link",
"https://drive.google.com/file/d/1eqFw9EVv9rGWJq1etYTZNc7AWHvRiX6g/view?usp=drive_link",
"https://drive.google.com/file/d/1a7svRBoEaRZQPGEiWgacCg4iPtdLsr7F/view?usp=drive_link",
"https://drive.google.com/file/d/1QgcKolfUHhUMmc_7jT3hTaRDFHnFBprD/view?usp=drive_link",
"https://drive.google.com/file/d/1uoaYK2D23DYEFA2E-nOkQprGJ-psOIgC/view?usp=drive_link"
];

let slideIndex=0;

setInterval(()=>{
slideIndex=(slideIndex+1)%slides.length;
document.getElementById("slide").src=slides[slideIndex];
},3000);

/* open gift */

gift.onclick=(e)=>{

sparkExplosion(e.clientX,e.clientY);

gift.style.display="none";
document.getElementById("giftText").style.display="none";

cake.style.display="block";
candle.style.display="block";

}

/* candle blow */

candle.onclick=()=>{

candle.innerHTML="💨";

hint.style.display="none";

music.play();

letter.style.opacity=1;

typeWriter();

confetti();

fireworks();

fireworksFinale();

document.getElementById("slideshow").style.display="block";

}

</script>

</body>
</html>
