<!DOCTYPE html>

<html>
<head>
<meta charset="UTF-8">
<title>Happy Birthday Mere Bacche🎂</title>

<style>

body{
margin:0;
font-family:Segoe UI;
background:black;
color:white;
text-align:center;
overflow-y:auto;
padding:40px;
}

.stars{
position:fixed;
width:100%;
height:100%;
background:url("https://i.imgur.com/YKY28eT.png");
animation:moveStars 80s linear infinite;
z-index:-1;
}

@keyframes moveStars{
from{background-position:0 0;}
to{background-position:10000px 5000px;}
}

/* shooting stars */

.shooting-star{
position:fixed;
width:2px;
height:80px;
background:white;
opacity:0.8;
transform:rotate(45deg);
animation:shoot 6s linear infinite;
}

@keyframes shoot{
0%{transform:translate(-200px,-200px) rotate(45deg);opacity:0;}
20%{opacity:1;}
100%{transform:translate(1200px,1200px) rotate(45deg);opacity:0;}
}

/* gift */

.gift{
font-size:90px;
cursor:pointer;
margin-top:50px;
animation:bounce 1.5s infinite;
}

@keyframes bounce{
0%,100%{transform:translateY(0);}
50%{transform:translateY(-10px);}
}

/* spark explosion */

.spark{
position:fixed;
width:6px;
height:6px;
background:white;
border-radius:50%;
animation:spark 1s ease-out forwards;
}

@keyframes spark{
to{
transform:scale(15);
opacity:0;
}
}

/* cake */

.cake{
font-size:90px;
margin-top:40px;
display:none;
}

/* candle */

.candle{
cursor:pointer;
font-size:50px;
display:none;
animation:glow 1.2s infinite alternate;
}

@keyframes glow{
from{text-shadow:0 0 10px orange;}
to{text-shadow:0 0 25px yellow;}
}

.hint{
font-size:14px;
opacity:0.6;
}

/* message card */

.letter{
margin:40px auto;
max-width:600px;
font-size:22px;
line-height:1.6;
opacity:0;
background:rgba(255,255,255,0.08);
backdrop-filter:blur(10px);
padding:30px;
border-radius:18px;
}

/* slideshow */

.slideshow{
max-width:420px;
max-height:520px;
margin:auto;
border-radius:15px;
overflow:hidden;
display:none;
}

.slideshow img{
max-width:100%;
max-height:500px;
width:auto;
height:auto;
object-fit:contain;
}

.slideshow{
box-shadow:0 10px 40px rgba(0,0,0,0.6);
}

/* confetti */

.confetti{
position:fixed;
width:8px;
height:8px;
top:-10px;
animation:fall 3s linear forwards;
}

@keyframes fall{
to{transform:translateY(100vh) rotate(720deg);}
}

/* fireworks */

.firework{
position:fixed;
width:6px;
height:6px;
background:white;
border-radius:50%;
animation:explode 1s ease-out forwards;
}

@keyframes explode{
to{
transform:scale(30);
opacity:0;
}
}

</style>

</head>

<body>

<div class="stars"></div>

<div class="shooting-star" style="top:10%;left:20%"></div>
<div class="shooting-star" style="top:30%;left:60%;animation-delay:3s"></div>

<h1>Tonight is a special night ✨</h1>
<p>Because a girl who is a super AMAZING, super INTELLIGENT, super AWESOME, super BEAUTIFUL and most importantly super CARING HUMAN, was born Today!!!!!</p>

<div class="gift" id="gift">🎁</div>
<div id="giftText">Click the gift to open it</div>

<div class="cake" id="cake">🎂</div>
<div class="candle" id="candle">🕯️</div>
<div class="hint" id="hint">Blow the candle</div>

<div class="letter" id="letter"></div>

<div class="slideshow" id="slideshow">
<img id="slide" src="Photos/Photo1.jpeg">
</div>

<audio id="music">
<source src="Nazar.mp3">
</audio>

<script>

const gift=document.getElementById("gift");
const cake=document.getElementById("cake");
const candle=document.getElementById("candle");
const hint=document.getElementById("hint");
const letter=document.getElementById("letter");
const music=document.getElementById("music");

/* typewriter */

const text="Happy Birthday Dear(Mera baccha), why are you so awesome? Like, how? Kehne ko aap meri saali ho but I think I have found a sister who's more like a friend to me with whom I can share all my thoughts without getting judged, I found my life partner in your sister but along with her I got a treasure(You) which I will protect and cherish for the rest of my life, aap meri saarthi ho aur maine pehle bhi kaha tha ki 'why to go anywhere else when I have my own Avatar of Krishna' and I mean it with all my heart. I always want you to keep smiling the way you are smiling right now and I will do everything in my power to make sure you always have a reason to smile also just wanted to let you know that you have the best smile and it suits you really well. YOU ARE THE BEST, I have said this a thousand times and I will keep saying it forever. Your Jeeju(Brother) loves you a lot and will always keep loving you forever. Again, Happy Birthday my you have a wonderful year and life ahead and may you get everything you ever wish for at you feet and I will play my part with full dedication to help you get everything. One more thing : You are the embodiment of moonlight, shining softly in our lives.”✨";

let i=0;

function typeWriter(){
if(i<text.length){
letter.innerHTML+=text.charAt(i);
i++;
setTimeout(typeWriter,35);
}
}

/* confetti */

function confetti(){
for(let i=0;i<120;i++){
let c=document.createElement("div");
c.className="confetti";
c.style.left=Math.random()*100+"vw";
c.style.background=`hsl(${Math.random()*360},100%,50%)`;
document.body.appendChild(c);
setTimeout(()=>c.remove(),3000);
}
}

/* fireworks */

function fireworks(){
for(let i=0;i<40;i++){
let fire=document.createElement("div");
fire.className="firework";
fire.style.left=Math.random()*100+"vw";
fire.style.top=Math.random()*60+"vh";
document.body.appendChild(fire);
setTimeout(()=>fire.remove(),1200);
}
}

/* fireworks finale */

function fireworksFinale(){

setInterval(()=>{

for(let i=0;i<20;i++){

let fire=document.createElement("div");
fire.className="firework";
fire.style.left=Math.random()*100+"vw";
fire.style.top=Math.random()*60+"vh";
document.body.appendChild(fire);

setTimeout(()=>fire.remove(),1200);

}

},2000)

}

/* spark explosion */

function sparkExplosion(x,y){

for(let i=0;i<40;i++){

let s=document.createElement("div");
s.className="spark";
s.style.left=x+"px";
s.style.top=y+"px";

document.body.appendChild(s);

setTimeout(()=>s.remove(),1000);

}

}

/* slideshow */

const slides=[
"Photo1.jpeg",
"Photo2.jpeg",
"Photo3.jpeg",
"Photo4.jpeg",
"Photo5.jpeg",
"Photo6.jpeg",
"Photo7.jpeg",
"Photo8.jpeg",
"Photo9.jpeg",
"Photo10.jpeg",
"Photo11.jpeg",
"Photo12.jpeg"
];

let slideIndex=0;

setInterval(()=>{
slideIndex=(slideIndex+1)%slides.length;
document.getElementById("slide").src=slides[slideIndex];
},3000);

/* open gift */

gift.onclick=(e)=>{

sparkExplosion(e.clientX,e.clientY);

gift.style.display="none";
document.getElementById("giftText").style.display="none";

cake.style.display="block";
candle.style.display="block";

}

/* candle blow */

candle.onclick=()=>{

candle.innerHTML="💨";

hint.style.display="none";

music.play();

letter.style.opacity=1;

typeWriter();

confetti();

fireworks();

fireworksFinale();

document.getElementById("slideshow").style.display="block";

}

</script>

</body>
</html>
